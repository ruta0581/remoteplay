<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta name="description" content="RemotePlay Rustホストへ接続する低遅延ブラウザゲスト">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; media-src blob:; connect-src ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RemotePlay Web Guest</title>
  <link rel="stylesheet" href="style.css?v=20260903-webcodecs-transform">
  <script src="app.js?v=20260903-h264-dc1" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">REMOTEPLAY / WEB GUEST</p>
      <div class="header-actions">
        <div class="actions">
          <button id="mobileMode" class="tool" type="button">スマホ操作</button>
          <button id="audio" class="tool" type="button" disabled>音声 ON</button>
          <button id="resync" class="tool" type="button" disabled>映像を再同期</button>
          <button id="fullscreen" class="tool" type="button" disabled>全画面</button>
        </div>
        <div id="badge" class="badge" data-state="idle">
          <span class="dot"></span><span id="badgeText">未接続</span>
        </div>
      </div>
    </header>

    <section class="card" aria-label="リモート映像">
      <div id="stage" class="stage">
        <video id="video" autoplay playsinline></video>
        <canvas id="videoCanvas" class="video-canvas" hidden></canvas>
        <audio id="audioOut" autoplay playsinline hidden></audio>
        <div class="placeholder">
          <div class="mark"><i></i><i></i><i></i></div>
          <p id="stageTitle">ホストに接続してください</p>
          <small id="stageDetail">ホスト画面の公開接続URLを貼り付けてください</small>
        </div>
      </div>
    </section>

    <section id="mobilePad" class="virtual-pad" aria-label="スマホ仮想ゲームパッド">
      <div class="pad-shoulders">
        <button class="pad-button" type="button" data-button="6">L2</button>
        <button class="pad-button" type="button" data-button="4">L1</button>
        <button class="pad-button" type="button" data-button="5">R1</button>
        <button class="pad-button" type="button" data-button="7">R2</button>
      </div>
      <div class="pad-main">
        <div class="dpad" aria-label="方向キー">
          <button class="pad-button" type="button" data-button="12">▲</button>
          <button class="pad-button" type="button" data-button="14">◀</button>
          <button class="pad-button" type="button" data-button="15">▶</button>
          <button class="pad-button" type="button" data-button="13">▼</button>
        </div>
        <div class="pad-center">
          <button class="pad-button" type="button" data-button="8">SELECT</button>
          <button class="pad-button" type="button" data-button="10">L3</button>
          <button class="pad-button" type="button" data-button="11">R3</button>
          <button class="pad-button" type="button" data-button="9">START</button>
        </div>
        <div class="face-pad" aria-label="操作ボタン">
          <button class="pad-button" type="button" data-button="3">Y</button>
          <button class="pad-button" type="button" data-button="2">X</button>
          <button class="pad-button" type="button" data-button="1">B</button>
          <button class="pad-button" type="button" data-button="0">A</button>
        </div>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="heading">
          <h2>接続</h2>
          <p>Rustホストが表示したURLを使用します / 内部バージョン <strong id="protocolVersion">--</strong></p>
        </div>
        <form id="form" novalidate>
          <label for="name">ゲスト名</label>
          <input id="name" maxlength="32" autocomplete="nickname" placeholder="ゲスト">

          <div class="controller-label">
            <label for="gamepad">使用するコントローラー</label>
            <span id="inputPulse" class="pulse" title="入力状態"></span>
          </div>
          <select id="gamepad">
            <option value="">ゲームパッド未検出（映像のみ接続可能）</option>
          </select>
          <p id="gamepadHelp" class="note">コントローラーのボタンを一度押すと、ブラウザが検出します。</p>

          <label for="url">公開接続URL</label>
          <input id="url" type="url" inputmode="url" spellcheck="false" placeholder="wss://example.trycloudflare.com/ws" required>
          <p id="error" class="error" role="alert"></p>

          <button id="connect" class="connect" type="submit">
            <span id="connectText">ホストへ接続</span><span class="arrow">→</span>
          </button>
        </form>
      </article>
    </section>

    <section class="metrics" aria-label="接続統計">
      <div class="metric"><span>解像度</span><strong id="resolution">-- × --</strong><small>VIDEO</small></div>
      <div class="metric"><span>フレームレート</span><strong id="fps">--</strong><small>FPS</small></div>
      <div class="metric"><span>往復時間</span><strong id="rtt">--</strong><small>RTT</small></div>
      <div class="metric"><span>受信バッファ</span><strong id="buffer">--</strong><small>JITTER</small></div>
      <div class="metric"><span>パケット損失</span><strong id="loss">--</strong><small>PACKETS</small></div>
      <div class="metric"><span>総映像遅延</span><strong id="display">--</strong><small>CAPTURE → DISPLAY</small></div>
    </section>

    <footer><span>RemotePlay Web Guest</span><span>WebRTC / H.264 / Opus</span></footer>
  </main>
</body>
</html>
