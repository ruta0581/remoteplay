<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta name="description" content="RemotePlay Rustホストへ接続する低遅延ブラウザゲスト">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; connect-src ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RemotePlay Web Guest</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#07101d;--panel:rgba(13,25,42,.8);--line:rgba(159,190,224,.16);
      --text:#f3f8ff;--muted:#91a3b8;--cyan:#57e4ff;--lime:#b8f36b;
      --danger:#ff747c;--warning:#ffd166;
      font-family:Inter,"Segoe UI","Yu Gothic UI",sans-serif;
    }
    *{box-sizing:border-box} html{min-height:100%;background:var(--bg)}
    body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(circle at 18% 0,rgba(30,138,183,.2),transparent 34rem),linear-gradient(145deg,#07101d,#081523 52%,#050b14);overflow-x:hidden}
    button,input,select{font:inherit} button{color:inherit}.shell{width:min(1180px,calc(100% - 40px));margin:auto;padding:36px 0 28px}
    header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}
    .eyebrow,.number{margin:0 0 7px;color:var(--cyan);font-size:.7rem;font-weight:800;letter-spacing:.2em}
    h1,h2,p{margin-top:0}h1{margin-bottom:0;font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.05;letter-spacing:-.045em}h2{margin-bottom:0;font-size:1.18rem}
    .badge{display:flex;align-items:center;gap:9px;min-width:116px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(5,12,21,.65);color:var(--muted);font-size:.8rem;font-weight:700}
    .dot,.pulse{width:8px;height:8px;border-radius:50%;background:#65768a;box-shadow:0 0 0 4px rgba(101,118,138,.12)}
    .badge[data-state=connecting] .dot{background:var(--warning);animation:pulse 1.2s infinite}.badge[data-state=connected]{color:var(--lime)}.badge[data-state=connected] .dot,.pulse.active{background:var(--lime);box-shadow:0 0 0 4px rgba(184,243,107,.12),0 0 16px rgba(184,243,107,.35)}.badge[data-state=error]{color:var(--danger)}.badge[data-state=error] .dot{background:var(--danger)}
    @keyframes pulse{50%{opacity:.35}}
    .card,.panel,.metrics,details{border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 28px 80px rgba(0,0,0,.34);backdrop-filter:blur(18px)}
    .card{overflow:hidden;border-radius:0}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#02060b}video{display:block;width:100%;height:100%;object-fit:contain;background:#02060b}
    .placeholder{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;padding:24px;text-align:center;background:linear-gradient(rgba(87,228,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(87,228,255,.035) 1px,transparent 1px),#050b13;background-size:44px 44px;transition:opacity .18s}.stage.has-video .placeholder{visibility:hidden;opacity:0}
    .mark{display:flex;align-items:end;gap:6px;height:42px;margin-bottom:22px}.mark i{width:9px;border-radius:8px;background:linear-gradient(var(--cyan),#12bad9);box-shadow:0 0 24px rgba(87,228,255,.35)}.mark i:nth-child(1){height:22px}.mark i:nth-child(2){height:42px}.mark i:nth-child(3){height:30px}
    .placeholder p{margin-bottom:7px;font-size:clamp(1.05rem,2vw,1.4rem);font-weight:750}.placeholder small{color:var(--muted)}
    .header-actions,.actions{display:flex;align-items:center;justify-content:flex-end;gap:7px}.header-actions{flex-wrap:wrap}.tool{min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(3,8,14,.72);backdrop-filter:blur(10px);cursor:pointer;font-size:.72rem}.tool:hover:not(:disabled){border-color:rgba(87,228,255,.5)}button:disabled{cursor:not-allowed;opacity:.42}
    .grid{display:block;margin-top:16px}.panel{padding:24px}.heading{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:24px}.heading>p{max-width:250px;margin:0;color:var(--muted);font-size:.78rem;line-height:1.6;text-align:right}
    label{display:block;margin:15px 0 7px;color:#afbdd0;font-size:.74rem;font-weight:700}input,select{width:100%;min-height:46px;border:1px solid rgba(159,190,224,.19);border-radius:11px;outline:0;background:rgba(2,8,15,.56);color:var(--text);padding:0 13px}input:focus,select:focus{border-color:rgba(87,228,255,.72);box-shadow:0 0 0 3px rgba(87,228,255,.09)}input::placeholder{color:#5e7187}.url-row{display:block}
    .connect{border:0;border-radius:11px;cursor:pointer;font-weight:800;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;margin-top:18px;padding:0 18px;background:linear-gradient(120deg,#3ed9f5,#6ae8dd);color:#041017;box-shadow:0 10px 30px rgba(36,201,229,.18)}.connect[data-action=disconnect]{background:linear-gradient(120deg,#ff8f94,#ffc2a6)}.arrow{font-size:1.35rem}.error{min-height:1.25em;margin:7px 0 0;color:var(--danger);font-size:.76rem}
    .controller-label{display:flex;align-items:flex-end;justify-content:space-between}.controller-label .pulse{margin:0 6px 11px 0}.note{margin:10px 0 0;color:var(--muted);font-size:.74rem;line-height:1.55}
    .virtual-pad{display:none;margin-top:12px;padding:12px;border:1px solid var(--line);background:rgba(5,13,23,.94);touch-action:none;user-select:none;-webkit-user-select:none}.mobile-mode .virtual-pad{display:block}.pad-shoulders,.pad-main,.pad-center{display:flex;align-items:center;justify-content:space-between;gap:10px}.pad-shoulders{margin-bottom:12px}.pad-main{align-items:center}.pad-center{align-self:stretch;flex-direction:column;justify-content:center}.pad-button{display:grid;place-items:center;min-width:54px;min-height:48px;border:1px solid rgba(159,190,224,.28);border-radius:13px;background:linear-gradient(145deg,#17283b,#0a1422);color:#dcecff;font-weight:850;box-shadow:0 4px 0 #03070d;touch-action:none}.pad-button.is-pressed{transform:translateY(3px);border-color:var(--cyan);background:#18394b;box-shadow:0 1px 0 #03070d;color:var(--cyan)}.pad-shoulders .pad-button{flex:1;min-height:42px}.dpad,.face-pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:3px}.dpad [data-button="12"],.face-pad [data-button="3"]{grid-column:2;grid-row:1}.dpad [data-button="14"],.face-pad [data-button="2"]{grid-column:1;grid-row:2}.dpad [data-button="15"],.face-pad [data-button="1"]{grid-column:3;grid-row:2}.dpad [data-button="13"],.face-pad [data-button="0"]{grid-column:2;grid-row:3}.dpad .pad-button,.face-pad .pad-button{min-width:58px;min-height:58px}.pad-center .pad-button{min-width:84px;min-height:38px;font-size:.68rem}.mobile-mode .shell{width:min(100% - 16px,1180px);padding-top:12px}.mobile-mode header{margin-bottom:10px}.mobile-mode .card{position:relative}.mobile-mode .stage{max-height:52vh}.mobile-mode .grid{margin-top:12px}
    .metrics{display:grid;grid-template-columns:repeat(6,1fr);margin-top:16px;overflow:hidden}.metric{min-height:118px;padding:20px}.metric+.metric{border-left:1px solid var(--line)}.metric span,.metric small{display:block;color:var(--muted);font-size:.65rem;font-weight:700;letter-spacing:.08em}.metric strong{display:block;margin:10px 0 4px;color:var(--cyan);font-size:clamp(1.05rem,1.8vw,1.55rem);font-variant-numeric:tabular-nums}
    details{margin-top:16px;padding:18px 22px;box-shadow:none}summary{cursor:pointer;font-weight:750}details ol{margin:16px 0 4px;padding-left:22px;color:var(--muted);font-size:.83rem;line-height:1.8}code{color:var(--cyan)}footer{display:flex;justify-content:space-between;padding:22px 4px 0;color:#5f7388;font-size:.68rem;letter-spacing:.08em}
    @media(max-width:800px){.shell{width:min(100% - 24px,680px);padding-top:22px}header{align-items:start}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(odd){border-left:0}.metric:nth-child(n+3){border-top:1px solid var(--line)}}
    @media(max-width:520px){header{display:block}.header-actions{justify-content:flex-start;margin-top:16px}.actions{order:2;flex-wrap:wrap;justify-content:flex-start}.badge{order:1}.panel{padding:20px}.heading{display:block}.heading>p{margin-top:10px;text-align:left}.stage{aspect-ratio:16/10}.tool{padding:0 9px;font-size:.66rem}footer{display:grid;gap:7px}.pad-button{min-width:44px}.dpad,.face-pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.dpad .pad-button,.face-pad .pad-button{min-width:48px;min-height:48px}.pad-center .pad-button{min-width:62px}}
    @media(max-width:430px){.pad-main{gap:4px}.dpad,.face-pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,46px)}.dpad .pad-button,.face-pad .pad-button{min-width:42px;min-height:46px}.pad-center .pad-button{min-width:48px;padding:0 4px;font-size:.58rem}.virtual-pad{padding:10px}.pad-shoulders{gap:6px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">REMOTEPLAY / WEB GUEST</p></div>
      <div class="header-actions">
        <div class="actions"><button id="mobileMode" class="tool" type="button">スマホ操作</button><button id="audio" class="tool" disabled>音声 ON</button><button id="resync" class="tool" disabled>映像を再同期</button><button id="fullscreen" class="tool" disabled>全画面</button></div>
        <div id="badge" class="badge" data-state="idle"><span class="dot"></span><span id="badgeText">未接続</span></div>
      </div>
    </header>

    <section class="card" aria-label="リモート映像">
      <div id="stage" class="stage">
        <video id="video" autoplay playsinline></video>
        <audio id="audioOut" autoplay playsinline hidden></audio>
        <div class="placeholder"><div class="mark"><i></i><i></i><i></i></div><p id="stageTitle">ホストに接続してください</p><small id="stageDetail">ホスト画面の公開接続URLを貼り付けてください</small></div>
      </div>
    </section>

    <section id="mobilePad" class="virtual-pad" aria-label="スマホ仮想ゲームパッド">
      <div class="pad-shoulders">
        <button class="pad-button" type="button" data-button="6">L2</button><button class="pad-button" type="button" data-button="4">L1</button>
        <button class="pad-button" type="button" data-button="5">R1</button><button class="pad-button" type="button" data-button="7">R2</button>
      </div>
      <div class="pad-main">
        <div class="dpad" aria-label="方向キー"><button class="pad-button" type="button" data-button="12">▲</button><button class="pad-button" type="button" data-button="14">◀</button><button class="pad-button" type="button" data-button="15">▶</button><button class="pad-button" type="button" data-button="13">▼</button></div>
        <div class="pad-center"><button class="pad-button" type="button" data-button="8">SELECT</button><button class="pad-button" type="button" data-button="10">L3</button><button class="pad-button" type="button" data-button="11">R3</button><button class="pad-button" type="button" data-button="9">START</button></div>
        <div class="face-pad" aria-label="操作ボタン"><button class="pad-button" type="button" data-button="3">Y</button><button class="pad-button" type="button" data-button="2">X</button><button class="pad-button" type="button" data-button="1">B</button><button class="pad-button" type="button" data-button="0">A</button></div>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="heading"><div><h2>接続</h2></div><p>Rustホストが表示したURLを使用します</p></div>
        <form id="form" novalidate>
          <label for="name">ゲスト名</label><input id="name" maxlength="32" autocomplete="nickname" placeholder="ゲスト">
          <div class="controller-label"><label for="gamepad">使用するコントローラー</label><span id="inputPulse" class="pulse" title="入力状態"></span></div>
          <select id="gamepad"><option value="">ゲームパッド未検出（映像のみ接続可能）</option></select>
          <p id="gamepadHelp" class="note">コントローラーのボタンを一度押すと、ブラウザが検出します。</p>
          <label for="url">公開接続URL</label>
          <div class="url-row"><input id="url" type="url" inputmode="url" spellcheck="false" placeholder="wss://example.trycloudflare.com/ws" required></div>
          <p id="error" class="error" role="alert"></p>
          <button id="connect" class="connect" type="submit"><span id="connectText">ホストへ接続</span><span class="arrow">→</span></button>
        </form>
      </article>
    </section>

    <section class="metrics" aria-label="接続統計">
      <div class="metric"><span>解像度</span><strong id="resolution">-- × --</strong><small>VIDEO</small></div>
      <div class="metric"><span>フレームレート</span><strong id="fps">--</strong><small>FPS</small></div>
      <div class="metric"><span>往復時間</span><strong id="rtt">--</strong><small>RTT</small></div>
      <div class="metric"><span>受信バッファ</span><strong id="buffer">--</strong><small>JITTER</small></div>
      <div class="metric"><span>パケット損失</span><strong id="loss">--</strong><small>PACKETS</small></div>
          <div class="metric"><span>総映像遅延</span><strong id="display">--</strong><small>CAPTURE → DISPLAY</small></div>
    </section>

    <footer><span>RemotePlay Web Guest</span><span>WebRTC / H.264 / Opus</span></footer>
  </main>

  <script>
    "use strict";
    const $=id=>document.getElementById(id),E={form:$("form"),name:$("name"),url:$("url"),error:$("error"),connect:$("connect"),connectText:$("connectText"),badge:$("badge"),badgeText:$("badgeText"),video:$("video"),audioOut:$("audioOut"),stage:$("stage"),stageTitle:$("stageTitle"),stageDetail:$("stageDetail"),audio:$("audio"),resync:$("resync"),fullscreen:$("fullscreen"),mobileMode:$("mobileMode"),mobilePad:$("mobilePad"),gamepad:$("gamepad"),gamepadHelp:$("gamepadHelp"),inputPulse:$("inputPulse"),rtt:$("rtt"),buffer:$("buffer"),fps:$("fps"),loss:$("loss"),display:$("display"),resolution:$("resolution")};
    const S={generation:0,ws:null,pc:null,dc:null,videoStream:null,audioStream:null,candidates:[],connected:false,manual:false,videoStarted:false,frameId:null,connectTimer:null,statsTimer:null,syncTimer:null,padFrame:null,padIndex:null,lockedPad:null,padSignature:"",lastPad:null,lastPadAt:0,lastInputAt:0,inputActive:false,previousInbound:null,mobile:false,virtualButtons:new Array(16).fill(0),virtualCounts:new Array(16).fill(0),virtualPointers:new Map()};
    const URL_KEY="remoteplay.webGuest.url";

    function status(state,label,title,detail){E.badge.dataset.state=state;E.badgeText.textContent=label;if(title)E.stageTitle.textContent=title;if(detail)E.stageDetail.textContent=detail}
    function connectionActive(){return Boolean(S.connected||S.ws||S.pc||S.lockedPad!==null)}
    function controls(active){E.connect.dataset.action=active?"disconnect":"connect";E.connectText.textContent=active?"切断する":"ホストへ接続";E.name.disabled=active;E.gamepad.disabled=active;E.url.disabled=active;E.mobileMode.disabled=active;E.audio.disabled=!active;E.resync.disabled=!active;E.fullscreen.disabled=!active}
    function normalize(raw){let value=raw.trim();if(!value)throw Error("公開接続URLを入力してください。");if(!/^[a-z][a-z\d+.-]*:\/\//i.test(value))value=`${location.protocol==="https:"?"wss":"ws"}://${value}`;const url=new URL(value);if(url.protocol==="https:")url.protocol="wss:";if(url.protocol==="http:")url.protocol="ws:";if(!["ws:","wss:"].includes(url.protocol))throw Error("URLは wss:// または ws:// で入力してください。");if(location.protocol==="https:"&&url.protocol==="ws:")throw Error("GitHub Pagesではwss://の公開接続URLが必要です。");if(!url.pathname||url.pathname==="/")url.pathname="/ws";url.hash="";return url.toString()}
    function signal(data){if(S.ws?.readyState===WebSocket.OPEN){S.ws.send(JSON.stringify(data));return true}return false}
    function data(data){if(S.dc?.readyState!=="open"||S.dc.bufferedAmount>262144)return false;S.dc.send(JSON.stringify(data));return true}
    function keyframe(reason){data({type:"keyframe_request",reason})}
    function receiverLowLatency(receiver){try{if("jitterBufferTarget"in receiver)receiver.jitterBufferTarget=0;else if("playoutDelayHint"in receiver)receiver.playoutDelayHint=0}catch(error){console.warn("Low latency hint rejected",error)}}
    function h264First(transceiver){try{const codecs=RTCRtpReceiver.getCapabilities?.("video")?.codecs?.filter(c=>c.mimeType.toLowerCase()==="video/h264");if(codecs?.length&&transceiver.setCodecPreferences)transceiver.setCodecPreferences(codecs)}catch(error){console.warn("H264 preference rejected",error)}}

    async function makePeer(generation){
      const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}],bundlePolicy:"max-bundle",rtcpMuxPolicy:"require"});S.pc=pc;S.videoStream=new MediaStream;S.audioStream=new MediaStream;E.video.srcObject=S.videoStream;E.audioOut.srcObject=S.audioStream;
      pc.onicecandidate=({candidate})=>{if(candidate&&generation===S.generation)signal({type:"candidate",candidate:candidate.toJSON()})};
      pc.ontrack=({track,receiver})=>{if(generation!==S.generation)return;receiverLowLatency(receiver);if(track.kind==="video"){if(!S.videoStream.getTracks().some(t=>t.id===track.id))S.videoStream.addTrack(track);E.video.play().catch(autoplay);monitorFrames(generation)}else if(track.kind==="audio"){if(!S.audioStream.getTracks().some(t=>t.id===track.id))S.audioStream.addTrack(track);if(!E.audioOut.muted)E.audioOut.play().catch(audioAutoplay)}};
      pc.onconnectionstatechange=()=>{if(generation!==S.generation)return;switch(pc.connectionState){case"connected":clearTimeout(S.connectTimer);S.connected=true;controls(true);status("connected","接続済み","映像を受信しています","WebRTC接続が確立しました");pc.getReceivers().forEach(receiverLowLatency);startStats();break;case"connecting":status("connecting","接続中","映像経路を確立しています","ICE接続を確認しています");break;case"failed":fail("WebRTC接続に失敗しました。URLとネットワークを確認してください。");break;case"disconnected":status("connecting","再接続中","通信が一時中断しました","ネットワークの復帰を待っています");break;case"closed":if(!S.manual)disconnected("接続が終了しました")}};
      const dc=pc.createDataChannel("input",{ordered:false,maxPacketLifeTime:50});setupDataChannel(dc,generation);
      const video=pc.addTransceiver("video",{direction:"recvonly"});h264First(video);pc.addTransceiver("audio",{direction:"recvonly"});
      await pc.setLocalDescription(await pc.createOffer());if(generation===S.generation)signal({type:"offer",sdp:pc.localDescription.sdp});
    }

    function setupDataChannel(dc,generation){S.dc=dc;dc.binaryType="arraybuffer";dc.bufferedAmountLowThreshold=32768;
      dc.onopen=()=>{if(generation!==S.generation)return;keyframe("browser_data_channel_open");let tries=0;clearInterval(S.syncTimer);S.syncTimer=setInterval(()=>{if(S.videoStarted||tries++>=8){clearInterval(S.syncTimer);return}keyframe("browser_waiting_for_video")},500);startPadPolling()};
      dc.onmessage=async event=>{try{const text=typeof event.data==="string"?event.data:event.data instanceof Blob?await event.data.text():new TextDecoder().decode(event.data);const message=JSON.parse(text);if(message.type==="ping"&&Number.isFinite(message.sent_at))data({type:"pong",sent_at:message.sent_at})}catch(error){console.warn("Unknown data message",error)}};
      dc.onclose=()=>{if(generation===S.generation&&!S.manual)fail("入力チャンネルが切断されました。")} }

    async function onSignal(raw,generation){let message;try{message=JSON.parse(raw)}catch{return}if(generation!==S.generation)return;
      if(message.type==="answer"){await S.pc.setRemoteDescription({type:"answer",sdp:message.sdp});for(const c of S.candidates.splice(0))await S.pc.addIceCandidate(c)}
      else if(message.type==="candidate"&&message.candidate){if(S.pc.remoteDescription)await S.pc.addIceCandidate(message.candidate);else S.candidates.push(message.candidate)}
      else if(message.type==="disconnect")await stop(false,message.reason||"ホストから切断されました");
    }

    async function start(){E.error.textContent="";let url;try{url=normalize(E.url.value)}catch(error){E.error.textContent=error.message;return}const selectedPad=padSelection(E.gamepad.value);await stop(false);S.padIndex=selectedPad;S.lockedPad=selectedPad;const generation=++S.generation;S.manual=false;S.videoStarted=false;S.candidates=[];E.stage.classList.remove("has-video");controls(true);status("connecting","接続中","ホストへ接続しています","WebSocketシグナリングを開始しています");
      const name=E.name.value.trim()||"ブラウザゲスト";E.url.value=url;localStorage.setItem(URL_KEY,url);
      try{S.ws=new WebSocket(url)}catch(error){fail(error.message);return}S.connectTimer=setTimeout(()=>{if(generation===S.generation&&!S.connected)fail("接続がタイムアウトしました。ホストで配信を開始してください。")},20000);
      S.ws.onopen=async()=>{if(generation!==S.generation)return;try{signal({type:"name",name});await makePeer(generation)}catch(error){fail(`接続準備に失敗しました: ${error.message}`)}};
      S.ws.onmessage=({data})=>onSignal(data,generation).catch(error=>fail(`シグナリング処理に失敗しました: ${error.message}`));S.ws.onerror=()=>{if(!S.connected)E.error.textContent="WebSocketへ接続できませんでした。URLを確認してください。"};S.ws.onclose=()=>{if(generation!==S.generation||S.manual)return;if(S.pc?.connectionState==="connected")status("connected","接続済み","映像を受信しています","映像接続は継続しています");else fail("ホストとの接続が終了しました。")} }

    async function stop(notify=true,reason="切断しました"){S.manual=true;S.connected=false;S.generation++;clearTimeout(S.connectTimer);clearInterval(S.statsTimer);clearInterval(S.syncTimer);if(S.padFrame!==null)cancelAnimationFrame(S.padFrame);if(notify)signal({type:"disconnect",reason:"Browser guest disconnected"});sendPadDisconnected();if(S.dc){S.dc.onclose=null;S.dc.close()}if(S.pc){S.pc.onconnectionstatechange=null;S.pc.close()}if(S.ws){S.ws.onclose=null;S.ws.close()}if(S.frameId!==null&&E.video.cancelVideoFrameCallback)E.video.cancelVideoFrameCallback(S.frameId);Object.assign(S,{ws:null,pc:null,dc:null,videoStream:null,audioStream:null,candidates:[],frameId:null,padFrame:null,videoStarted:false,lastPad:null,lockedPad:null,inputActive:false,previousInbound:null});resetVirtualPad();E.inputPulse.classList.remove("active");E.video.pause();E.video.srcObject=null;E.audioOut.pause();E.audioOut.srcObject=null;E.stage.classList.remove("has-video");resetMetrics();disconnected(reason);refreshPads(true)}
    function fail(message){E.error.textContent=message;stop(false,message);status("error","接続失敗","接続できませんでした",message)}
    function disconnected(title){controls(false);status("idle","未接続",title,"ホスト画面の公開接続URLを貼り付けてください")}
    function autoplay(error){console.warn("Autoplay blocked",error);E.error.textContent="映像をクリックすると再生を開始できます。"}
    function audioAutoplay(error){console.warn("Audio autoplay blocked",error);E.audioOut.muted=true;E.audio.textContent="音声 OFF";E.error.textContent="音声を再生するには「音声 OFF」を一度押してください。"}
    function resyncVideo(){S.pc?.getReceivers().forEach(receiverLowLatency);E.video.playbackRate=1;E.video.play().catch(autoplay);if(!S.videoStarted)keyframe("browser_manual_start")}

    function monitorFrames(generation){if(!E.video.requestVideoFrameCallback||S.frameId!==null)return;let lastUiUpdate=0;const frame=(now,m)=>{if(generation!==S.generation)return;if(!S.videoStarted){S.videoStarted=true;E.stage.classList.add("has-video")}if(now-lastUiUpdate>=250){lastUiUpdate=now;E.resolution.textContent=`${m.width||E.video.videoWidth} × ${m.height||E.video.videoHeight}`;const origin=Number.isFinite(m.captureTime)?m.captureTime:m.receiveTime;if(Number.isFinite(origin)&&Number.isFinite(m.expectedDisplayTime))E.display.textContent=`${Math.round(Math.max(0,m.expectedDisplayTime-origin))} ms`}S.frameId=E.video.requestVideoFrameCallback(frame)};S.frameId=E.video.requestVideoFrameCallback(frame)}
    function startStats(){clearInterval(S.statsTimer);stats();S.statsTimer=setInterval(stats,1000)}
    async function stats(){
      if(!S.pc||S.pc.connectionState==="closed")return;
      try{
        const reports=await S.pc.getStats();let inbound,pair;
        reports.forEach(r=>{if(r.type==="inbound-rtp"&&r.kind==="video"&&!r.isRemote)inbound=r;if(r.type==="candidate-pair"&&r.state==="succeeded"&&(r.nominated||r.selected))pair=r});
        if(Number.isFinite(pair?.currentRoundTripTime)){const ms=pair.currentRoundTripTime*1000;E.rtt.textContent=ms>0&&ms<1?"<1 ms":`${Math.round(ms)} ms`}
        if(inbound){
          E.loss.textContent=String(inbound.packetsLost||0);
          if(S.previousInbound){const elapsed=(inbound.timestamp-S.previousInbound.timestamp)/1000,decoded=(inbound.framesDecoded||0)-S.previousInbound.decoded,count=(inbound.jitterBufferEmittedCount||0)-S.previousInbound.count,delay=(inbound.jitterBufferDelay||0)-S.previousInbound.delay;if(elapsed>0&&decoded>=0)E.fps.textContent=`${Math.round(decoded/elapsed)} fps`;if(count>0&&delay>=0)E.buffer.textContent=`${Math.round(delay/count*1000)} ms`}
          else if(Number.isFinite(inbound.framesPerSecond))E.fps.textContent=`${Math.round(inbound.framesPerSecond)} fps`;
          S.previousInbound={timestamp:inbound.timestamp,decoded:inbound.framesDecoded||0,count:inbound.jitterBufferEmittedCount||0,delay:inbound.jitterBufferDelay||0};
        }
      }catch(error){console.warn("Stats failed",error)}
    }
    function resetMetrics(){[E.rtt,E.buffer,E.fps,E.loss,E.display].forEach(e=>e.textContent="--");E.resolution.textContent="-- × --"}

    function padSelection(value){return value==="virtual"?"virtual":value===""?null:Number(value)}
    function refreshPads(force=false){if(connectionActive()&&!force)return;const pads=Array.from(navigator.getGamepads?.()||[]).filter(Boolean),signature=`${S.mobile}|${pads.map(p=>`${p.index}:${p.id}`).join("|")}`,old=S.padIndex;if(!force&&signature===S.padSignature)return;S.padSignature=signature;E.gamepad.replaceChildren();E.gamepad.add(new Option("コントローラーなし（映像のみ）",""));if(S.mobile)E.gamepad.add(new Option("スマホ仮想デジタルパッド","virtual"));pads.forEach(p=>E.gamepad.add(new Option(`#${p.index+1} ${p.id}`,String(p.index))));const oldExists=old==="virtual"&&S.mobile||Number.isInteger(old)&&pads.some(p=>p.index===old);S.padIndex=oldExists?old:S.mobile?"virtual":pads[0]?.index??null;E.gamepad.value=S.padIndex===null?"":String(S.padIndex);E.gamepadHelp.textContent=S.padIndex==="virtual"?"画面下の仮想パッドを使用します。接続後は変更できません。":pads.length?`${pads.length}台検出 / 接続後はコントローラーを変更できません。`:"コントローラーのボタンを一度押すと、ブラウザが検出します。"}
    function padPayload(pad,connected=true){const sourceButtons=pad?.buttons||[],sourceAxes=pad?.axes||[],buttons=new Array(sourceButtons.length),axes=new Array(Math.min(4,sourceAxes.length));for(let i=0;i<buttons.length;i++)buttons[i]={pressed:sourceButtons[i].pressed,value:Math.round(sourceButtons[i].value*1000)/1000};for(let i=0;i<axes.length;i++)axes[i]=Math.round(sourceAxes[i]*1000)/1000;return{type:"gamepad",gamepad:{id:pad?.id||"Browser Gamepad",connected,mapping:pad?.mapping||"standard",buttons,axes}}}
    function virtualPad(){return{id:"RemotePlay Mobile Digital Pad",mapping:"standard",buttons:S.virtualButtons.map(value=>({pressed:value>0,value})),axes:[0,0,0,0]}}
    function encodedButton(button){return Math.round(button.value*1000)+(button.pressed?2001:0)}
    function padChanged(pad){const previous=S.lastPad,axisCount=Math.min(4,pad.axes.length);if(!previous||previous.id!==pad.id||previous.mapping!==pad.mapping||previous.buttons.length!==pad.buttons.length||previous.axes.length!==axisCount)return true;for(let i=0;i<pad.buttons.length;i++)if(previous.buttons[i]!==encodedButton(pad.buttons[i]))return true;for(let i=0;i<axisCount;i++)if(previous.axes[i]!==Math.round(pad.axes[i]*1000))return true;return false}
    function rememberPad(pad){const snapshot=S.lastPad||{id:"",mapping:"",buttons:[],axes:[]},axisCount=Math.min(4,pad.axes.length);snapshot.id=pad.id;snapshot.mapping=pad.mapping;snapshot.buttons.length=pad.buttons.length;snapshot.axes.length=axisCount;for(let i=0;i<pad.buttons.length;i++)snapshot.buttons[i]=encodedButton(pad.buttons[i]);for(let i=0;i<axisCount;i++)snapshot.axes[i]=Math.round(pad.axes[i]*1000);S.lastPad=snapshot}
    function startPadPolling(){if(S.padFrame!==null)cancelAnimationFrame(S.padFrame);S.lastPad=null;S.lastPadAt=0;const tick=()=>{pollPad();S.padFrame=S.dc?.readyState==="open"?requestAnimationFrame(tick):null};S.padFrame=requestAnimationFrame(tick)}
    function pollPad(){if(S.dc?.readyState!=="open"||S.lockedPad===null)return inputPulse();const pad=S.lockedPad==="virtual"?virtualPad():navigator.getGamepads?.()[S.lockedPad];if(!pad)return inputPulse();const now=performance.now();if(padChanged(pad)||now-S.lastPadAt>=100){if(data(padPayload(pad))){rememberPad(pad);S.lastPadAt=now}}if(pad.buttons.some(b=>b.pressed||b.value>.1)||pad.axes.some(a=>Math.abs(a)>.12))S.lastInputAt=now;inputPulse()}
    function inputPulse(){const active=performance.now()-S.lastInputAt<180;if(active!==S.inputActive){S.inputActive=active;E.inputPulse.classList.toggle("active",active)}}
    function sendPadDisconnected(){if(S.dc?.readyState!=="open"||S.lockedPad===null)return;const pad=S.lockedPad==="virtual"?virtualPad():navigator.getGamepads?.()[S.lockedPad];data(padPayload(pad,false))}
    function resetVirtualPad(){S.virtualButtons.fill(0);S.virtualCounts.fill(0);S.virtualPointers.clear();E.mobilePad.querySelectorAll(".is-pressed").forEach(button=>button.classList.remove("is-pressed"))}
    function pressVirtualButton(event){event.preventDefault();if(event.button!==undefined&&event.pointerType==="mouse"&&event.button!==0)return;const button=event.currentTarget,index=Number(button.dataset.button);button.setPointerCapture?.(event.pointerId);if(S.virtualPointers.has(event.pointerId))return;S.virtualPointers.set(event.pointerId,{index,button});S.virtualCounts[index]++;S.virtualButtons[index]=1;button.classList.add("is-pressed");S.lastInputAt=performance.now();inputPulse()}
    function releaseVirtualButton(event){const active=S.virtualPointers.get(event.pointerId);if(!active)return;S.virtualPointers.delete(event.pointerId);S.virtualCounts[active.index]=Math.max(0,S.virtualCounts[active.index]-1);S.virtualButtons[active.index]=S.virtualCounts[active.index]>0?1:0;if(!S.virtualButtons[active.index])active.button.classList.remove("is-pressed");event.preventDefault()}

    E.form.addEventListener("submit",event=>{event.preventDefault();if(S.connected||S.ws||S.pc)stop(true);else start()});E.gamepad.addEventListener("change",()=>{if(connectionActive())return;S.padIndex=padSelection(E.gamepad.value);S.lastPad=null;refreshPads(true)});
    E.mobileMode.addEventListener("click",()=>{if(connectionActive())return;S.mobile=!S.mobile;document.body.classList.toggle("mobile-mode",S.mobile);E.mobileMode.textContent=S.mobile?"PC表示":"スマホ操作";resetVirtualPad();S.padIndex=S.mobile?"virtual":null;S.padSignature="";refreshPads(true)});
    E.mobilePad.querySelectorAll("[data-button]").forEach(button=>{button.addEventListener("pointerdown",pressVirtualButton);button.addEventListener("pointerup",releaseVirtualButton);button.addEventListener("pointercancel",releaseVirtualButton);button.addEventListener("lostpointercapture",releaseVirtualButton);button.addEventListener("contextmenu",event=>event.preventDefault())});
    E.audio.addEventListener("click",()=>{E.audioOut.muted=!E.audioOut.muted;E.audio.textContent=E.audioOut.muted?"音声 OFF":"音声 ON";if(!E.audioOut.muted)E.audioOut.play().catch(audioAutoplay)});E.resync.addEventListener("click",resyncVideo);E.fullscreen.addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():E.stage.requestFullscreen?.());E.video.addEventListener("click",()=>{E.video.play().catch(autoplay);if(!E.audioOut.muted)E.audioOut.play().catch(audioAutoplay)});E.video.addEventListener("pause",()=>{if(S.connected)E.video.play().catch(autoplay)});
    window.addEventListener("gamepadconnected",()=>{if(!connectionActive())refreshPads()});window.addEventListener("gamepaddisconnected",event=>{if(connectionActive()){if(S.lockedPad===event.gamepad.index)sendPadDisconnected();return}refreshPads()});window.addEventListener("beforeunload",()=>{signal({type:"disconnect",reason:"Browser page closed"});sendPadDisconnected()});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.connected)keyframe("browser_became_visible")});
    function addressFromPageUrl(){const params=new URLSearchParams(location.search),named=params.get("ws")||params.get("host")||params.get("url");if(named)return named;for(const raw of [location.search.slice(1),location.hash.slice(1)]){if(!raw)continue;let decoded=raw;try{decoded=decodeURIComponent(raw)}catch{}if(/^wss?:\/\//i.test(decoded))return decoded;const assigned=decoded.match(/^(?:ws|host|url)=(wss?:\/\/.+)$/i);if(assigned)return assigned[1]}const path=decodeURIComponent(location.pathname);return path.match(/\/(wss?:\/\/.+)$/i)?.[1]||""}
    E.url.value=addressFromPageUrl()||localStorage.getItem(URL_KEY)||"";E.name.value="";localStorage.removeItem("remoteplay.webGuest.name");refreshPads(true);setInterval(()=>refreshPads(),5000);resetMetrics();disconnected("ホストに接続してください");
  </script>
</body>
